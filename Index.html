      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">

<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="IDX Stock">
<link id="appIcon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23000'/%3E%3Ccircle cx='256' cy='256' r='134' fill='none' stroke='%23fff' stroke-width='32'/%3E%3C/svg%3E">
<link id="appleIcon" rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23000'/%3E%3Ccircle cx='256' cy='256' r='134' fill='none' stroke='%23fff' stroke-width='32'/%3E%3C/svg%3E">
<script>
/* =====================================================
   PWA SINGLE-FILE
   - Logo mengikuti desain: cincin + 2 titik
   - Manifest dibuat otomatis
   - Mendukung tombol Install / Add to Home Screen
===================================================== */
(function(){
  function makeIcon(size){
    var c=document.createElement('canvas');
    c.width=c.height=size;
    var x=c.getContext('2d');
    x.fillStyle='#000';
    x.fillRect(0,0,size,size);

    var s=size/512;
    x.strokeStyle='#fff';
    x.lineWidth=32*s;
    x.lineCap='butt';
    x.beginPath();
    x.arc(256*s,256*s,134*s,0,Math.PI*2);
    x.stroke();

    /* gap/overlap area is naturally covered by the large dot */
    x.fillStyle='#fff';
    x.beginPath();
    x.arc(380*s,125*s,67*s,0,Math.PI*2);
    x.fill();

    x.beginPath();
    x.arc(438*s,391*s,25*s,0,Math.PI*2);
    x.fill();

    return c.toDataURL('image/png');
  }

  try{
    var i192=makeIcon(192), i512=makeIcon(512);
    var apple=makeIcon(180);

    document.getElementById('appleIcon').href=apple;
    document.getElementById('appIcon').href=i192;
    document.getElementById('appIcon').type='image/png';

    var base=location.href.split('#')[0].split('?')[0];
    var manifest={
      name:'IDX Stock Cloud',
      short_name:'IDX Stock',
      description:'IDX Stock Cloud — pencarian & harga saham Indonesia (BEI)',
      start_url:base,
      scope:base.replace(/[^\/]*$/,''),
      id:base,
      display:'standalone',
      orientation:'portrait',
      background_color:'#000000',
      theme_color:'#000000',
      prefer_related_applications:false,
      icons:[
        {src:i192,sizes:'192x192',type:'image/png',purpose:'any maskable'},
        {src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'}
      ]
    };

    var l=document.createElement('link');
    l.rel='manifest';
    l.href=URL.createObjectURL(
      new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'})
    );
    document.head.appendChild(l);
  }catch(e){
    console.warn('PWA setup failed',e);
  }
})();
</script>

/* =====================================================

===================================================== */

.stockCard{
  position:absolute;

  left:0;
  top:0;

  width:var(--size);
  height:var(--size);

  border-radius:50%;

  touch-action:none;
  user-select:none;
  -webkit-user-select:none;

  will-change:
    transform,
    width,
    height;

  cursor:grab;

  transform:
    translate3d(
      var(--x),
      var(--y),
      0
    )
    rotate(
      var(--rot)
    )
    scale(var(--pulse,1));

  z-index:10;
}

.stockCard.dragging{
  z-index:60000;
  cursor:grabbing;
}

.stockBody{
  position:relative;

  width:100%;
  height:100%;

  border-radius:50%;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:calc(var(--size) * .012);

  overflow:hidden;

  border:
    1px solid
    rgba(120,126,132,.85);

  background:
    radial-gradient(
      circle at 35% 25%,
      rgba(180,185,190,.12),
      rgba(18,18,18,.91) 62%,
      #000 100%

  box-shadow:
    inset 0 0 15px
    rgba(190,195,200,.055),

    0 0 13px
    rgba(180,185,190,.025);

  pointer-events:none;
}

.stockBody::after{
  content:"";

  position:absolute;
  inset:calc(var(--size) * .025);

  border-radius:50%;

  border:
    1px solid
    rgba(180,185,190,.08);
}

.stockLogo{

  height:44%;

  max-width:none;

  background:#000;

  border:

  padding:1px;
}

.stockSymbol{

<script>

/* =====================================================
   CONFIG
===================================================== */

const IDX_LIST=[];
let TOTAL_STOCKS = 0;

const STOCKS_PER_PAGE = 100;

const TOTAL_PAGES =
  Math.ceil(
    TOTAL_STOCKS /
    STOCKS_PER_PAGE
  );

const MIN_SIZE = 52;

const MAX_SIZE = 118;

const SAFE_TOP = 55;


/* =====================================================
   STATE
===================================================== */

let allStocks = [];

let visibleStocks = [];

let currentPage = 0;

let selectedStock = null;

let drag = null;

let socket = null;
let reconnectTimer = null;
let liveReconnectAttempt = 0;
const LIVE_REFRESH_MS = 15000;

/* CACHE: simpan semua saham di localStorage, request TradingView maksimal tiap 5 menit */
const CACHE_KEY='idx_stock_cache_v3_tradingview';
const CACHE_MS=5*60*1000; /* cache & refresh tiap 5 menit */
let lastAttemptTs=0;
function readStockCache(){
  try{
    const raw=localStorage.getItem(CACHE_KEY); if(!raw)return null;
    const c=JSON.parse(raw);
    if(c&&Array.isArray(c.stocks)&&c.stocks.length&&Number.isFinite(c.ts))return c;
  }catch(e){}
  return null;
}
function writeStockCache(){
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({ts:Date.now(),stocks:allStocks}));}catch(e){}
}
function indexStocks(){
  stockMap.clear(); stockBySymbol.clear();
  allStocks.forEach((stock,index)=>{stock.market_cap_rank=index+1;stockMap.set(stock.id,stock);stockBySymbol.set(stock.symbol.toUpperCase(),stock);});
}

let positions = new Map();

let nodes = new Map();

let stockMap = new Map();
let stockBySymbol = new Map();


/* =====================================================
   DOM
===================================================== */

const cloud =
  document.getElementById(
    'cloud'
  );

const pageButton =
  document.getElementById(
    'pageButton'
  );

const pageMenu =
  document.getElementById(
    'pageMenu'
  );


/* =====================================================
   FORMAT
===================================================== */

function price(v){

  if(v == null)
    return '—';

  v=Number(v);

  if(v>=1000)
    return 'Rp '+
      v.toLocaleString(
        'id-ID',
        {
          maximumFractionDigits:1
        }
      );

  if(v>=1)
    return 'Rp '+
      v.toLocaleString(
        'id-ID',
        {
          maximumFractionDigits:3
        }
      );

  if(v>=0.01)
    return 'Rp '+
      v.toLocaleString(
        'id-ID',
        {
          maximumFractionDigits:4
        }
      );

  return 'Rp '+
    v.toLocaleString(
      'id-ID',
      {
        maximumFractionDigits:8
      }
    );
}


function percent(v){

  if(v==null)
    return '—';

  v=Number(v);

  return (
    v>=0
      ?'+'
      :''
  )+
  v.toFixed(2)+
  '%';
}


function large(v){

  if(v==null)
    return '—';

  v=Number(v);

  if(v>=1e12)
    return 'Rp '+
      (v/1e12).toFixed(2)+
      'T';

  if(v>=1e9)
    return 'Rp '+
      (v/1e9).toFixed(2)+
      'B';

  if(v>=1e6)
    return 'Rp '+
      (v/1e6).toFixed(2)+
      'M';

  if(v>=1e3)
    return 'Rp '+
      (v/1e3).toFixed(2)+
      'K';

  return 'Rp '+
    v.toLocaleString();
}


function supply(v){

  if(v==null)
    return '—';

  v=Number(v);

  if(v>=1e12)
    return (v/1e12).toFixed(2)+'T';

  if(v>=1e9)
    return (v/1e9).toFixed(2)+'B';

  if(v>=1e6)
    return (v/1e6).toFixed(2)+'M';

  return v.toLocaleString(
    'en-US',
    {
      maximumFractionDigits:0
    }
  );
}


/* =====================================================
   stock SIZE BASED ON GAIN
===================================================== */

function sizeFromGain(gain){

  const g=
    Math.min(
      Math.abs(
        Number(gain)||0
      ),
      100
    );

  const n=
    Math.pow(
      g/100,
      .48
    );

  return Math.round(
    MIN_SIZE+
    (
      MAX_SIZE-
      MIN_SIZE
    )*n
  );
}


/* =====================================================
   RANDOM
===================================================== */

function random(min,max){

  return Math.random()*
    (max-min)+min;
}


/* =====================================================
   VIEW MODE: bubble / list (tetap di halaman utama)
===================================================== */
let viewMode='bubble';
const listRows=new Map();
function setViewMode(mode){
  viewMode=mode;
  document.querySelector('.app').classList.toggle('listMode',mode==='list');
  pageMenu.querySelectorAll('.viewBtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  if(mode==='list'){renderStockList();const l=document.getElementById('stockList');if(l)l.scrollTop=0;}
}
let listSource='own';            // 'own' = dropdown + funnel, 'menu' = filter dari menu
let listRankStart=1;             // 1,101,...,901
let listSort='marketcap';        // marketcap | trending | gainer | loser
const SORT_LABELS={trending:'Trending',gainer:'Gainer',loser:'Loser',marketcap:'Marketcap'};
function getListStocks(){
  if(listSource==='menu')return visibleStocks;
  const base=allStocks.slice(listRankStart-1,listRankStart+99);
  const g=c=>Number(c.price_change_percentage_24h)||0;
  if(listSort==='gainer')base.sort((a,b)=>g(b)-g(a));
  else if(listSort==='loser')base.sort((a,b)=>g(a)-g(b));
  else if(listSort==='trending')base.sort((a,b)=>(Number(b.total_volume)||0)-(Number(a.total_volume)||0));
  else base.sort((a,b)=>(Number(b.market_cap)||0)-(Number(a.market_cap)||0));
  return base;
}
function renderStockList(){
  const box=document.getElementById('listRows'), scroller=document.getElementById('stockList'); if(!box)return;
  const keep=scroller?scroller.scrollTop:0;
  listRows.clear(); box.innerHTML='';
  const frag=document.createDocumentFragment();
  getListStocks().forEach(stock=>{
    const row=document.createElement('div'); row.className='stockRow';
    const img=document.createElement('img'); img.alt=''; img.loading='lazy'; setReliableLogo(img,stock.symbol);
    const info=document.createElement('div'); info.className='rInfo';
    const sym=document.createElement('div'); sym.className='rSym'; sym.textContent=stock.symbol.toUpperCase();
    const nm=document.createElement('div'); nm.className='rName'; nm.textContent=stock.name;
    info.appendChild(sym); info.appendChild(nm);
    const right=document.createElement('div'); right.className='rRight';
    const pr=document.createElement('div'); pr.className='rPrice';
    const gn=document.createElement('div'); gn.className='rGain';
    right.appendChild(pr); right.appendChild(gn);
    const star=document.createElement('button'); star.className='rStar'+(localStorage.getItem('fav_'+stock.id)==='1'?' active':'');
    star.setAttribute('aria-label','Favorite'); star.title='Favorite';
    star.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 3.8l2.55 5.17 5.7.83-4.13 4.03.98 5.68L12 16.83l-5.1 2.68.98-5.68-4.13-4.03 5.7-.83L12 3.8z"/></svg>';
    star.onclick=(e)=>{
      e.stopPropagation();
      const key='fav_'+stock.id, on=localStorage.getItem(key)==='1';
      localStorage.setItem(key,on?'0':'1');
      star.classList.toggle('active',!on);
    };
    row.appendChild(img); row.appendChild(info); row.appendChild(right); row.appendChild(star);
    row.onclick=()=>openPopup(stock.id);
    listRows.set(stock.id,{pr,gn,star});
    fillListRow(stock,pr,gn);
    frag.appendChild(row);
  });
  box.appendChild(frag);
  if(scroller)scroller.scrollTop=keep;
}
function initListBar(){
  const btn=document.getElementById('listSortBtn'),
        menu=document.getElementById('listSortMenu'), label=document.getElementById('listSortLabel'),
        rBtn=document.getElementById('listRankBtn'), rMenu=document.getElementById('listRankMenu'), rLabel=document.getElementById('listRankLabel');
  const closeRank=()=>{rMenu.classList.remove('show');rBtn.classList.remove('open');};
  const fillRank=()=>{
  rMenu.innerHTML='';
  for(let st=1;st<=TOTAL_STOCKS;st+=100){
    const o=document.createElement('button'); o.className='sortOpt'+(st===1?' active':''); o.dataset.st=st; o.textContent=st+' – '+Math.min(st+99,TOTAL_STOCKS);
    o.onclick=()=>{
      listSource='own';listRankStart=st;rLabel.textContent=o.textContent;
      rMenu.querySelectorAll('.sortOpt').forEach(x=>x.classList.toggle('active',x===o));
      closeRank();paint();renderStockList();document.getElementById('stockList').scrollTop=0;
    };
    rMenu.appendChild(o);
  }
  };
  fillRank(); window.__fillRank=fillRank;
  rBtn.onclick=(e)=>{e.stopPropagation();menu.classList.remove('show');btn.classList.remove('open');const o=rMenu.classList.toggle('show');rBtn.classList.toggle('open',o);};
  const paint=()=>{
    label.textContent=SORT_LABELS[listSort];
    menu.querySelectorAll('.sortOpt').forEach(b=>b.classList.toggle('active',listSource==='own'&&b.dataset.k===listSort));
  };
  Object.keys(SORT_LABELS).forEach(k=>{
    const b=document.createElement('button'); b.className='sortOpt'; b.dataset.k=k; b.textContent=SORT_LABELS[k];
    b.onclick=()=>{listSource='own';listSort=k;closeRank();menu.classList.remove('show');btn.classList.remove('open');paint();renderStockList();document.getElementById('stockList').scrollTop=0;};
    menu.appendChild(b);
  });
  btn.onclick=(e)=>{e.stopPropagation();closeRank();const o=menu.classList.toggle('show');btn.classList.toggle('open',o);};
  document.addEventListener('click',()=>{closeRank();menu.classList.remove('show');btn.classList.remove('open');});
  paint();
}
initListBar();
function fillListRow(stock,pr,gn){
  const g=Number(stock.price_change_percentage_24h)||0;
  pr.textContent=price(stock.current_price);
  gn.textContent=percent(g);
  gn.className='rGain '+(g>=0?'up':'down');
}
function updateListRow(stock){
  const r=listRows.get(stock.id); if(r)fillListRow(stock,r.pr,r.gn);
}

/* =====================================================
   PAGE MENU
===================================================== */

function createPageMenu(){

function applyMarketFilter(name){listSource='menu';let base=[...allStocks]; if(name==='Gainer')base.sort((a,b)=>(b.price_change_percentage_24h||0)-(a.price_change_percentage_24h||0)); if(name==='Looser')base.sort((a,b)=>(a.price_change_percentage_24h||0)-(b.price_change_percentage_24h||0)); if(name==='Favorite')base=base.filter(c=>localStorage.getItem('fav_'+c.id)==='1'); visibleStocks=base.slice(0,STOCKS_PER_PAGE); cloud.innerHTML='';nodes.clear();createPositions();visibleStocks.forEach(c=>cloud.appendChild(createStock(c)))}
let activeTimeFrame='1D';
function getLiveTimeframeGain(c,name){
  if(name==='1H')return Number(c.price_change_percentage_1h_in_currency)||0;
  if(name==='1D')return Number(c.price_change_percentage_24h)||0;
  if(name==='1W')return Number(c.price_change_percentage_7d_in_currency)||0;
  if(name==='1M')return Number(c.price_change_percentage_30d_in_currency)||0;
  // IDX Stock Data does not provide 4H/1Y in the markets endpoint used here.
  // Use the current 24H value as the live fallback until a historical source is available.
  return Number(c.price_change_percentage_24h)||0;
}
function applyTimeFilter(name){
  if(!allStocks.length)return;
  listSource='menu';
  if(name.startsWith('Rank')){
    activeTimeFrame='RANK';
    const m=name.match(/(\d+)[–-](\d+)/);
    const base=allStocks.slice(Number(m[1])-1,Number(m[2]));
    visibleStocks=base.slice(0,STOCKS_PER_PAGE);
  }else{
    activeTimeFrame=name;
    const base=[...allStocks];
    base.sort((a,b)=>getLiveTimeframeGain(b,name)-getLiveTimeframeGain(a,name));
    visibleStocks=base.slice(0,STOCKS_PER_PAGE);
  }
  cloud.innerHTML='';nodes.clear();createPositions();visibleStocks.forEach(c=>cloud.appendChild(createStock(c)));
}

function refreshActiveTimeframe(){
  if(!allStocks.length)return;
  if(activeTimeFrame==='RANK')return;
  const base=[...allStocks].sort((a,b)=>getLiveTimeframeGain(b,activeTimeFrame)-getLiveTimeframeGain(a,activeTimeFrame));
  visibleStocks=base.slice(0,STOCKS_PER_PAGE);
  visibleStocks.forEach(c=>updateStock(c));
  // Rebuild only when the ordering changes so the live cloud follows the selected timeframe.
  const ids=visibleStocks.map(c=>c.id).join('|');
  const currentIds=[...nodes.keys()].join('|');
  if(ids!==currentIds){
    cloud.innerHTML='';nodes.clear();createPositions();visibleStocks.forEach(c=>cloud.appendChild(createStock(c)));
  }
}

/* =====================================================
   POSITIONS
===================================================== */

function createPositions(){

  renderStockList();

  positions.clear();

  const width=
    innerWidth;

  const height=
    innerHeight;

  const placed=[];

  visibleStocks.forEach(
    stock=>{

      const size=
        sizeFromGain(
          stock.price_change_percentage_24h
        );

      let x=0;
      let y=0;

      let found=false;

      for(
        let attempt=0;
        attempt<350;
        attempt++
      ){

        x=
          random(
            1,
            Math.max(
              2,
              width-size-1
            )
          );

        y=
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size-1
            )
          );

        let good=true;

        for(
          const p of placed
        ){

          const dx=
            (
              x+
              size/2
            )-
            (
              p.x+
              p.size/2
            );

          const dy=
            (
              y+
              size/2
            )-
            (
              p.y+
              p.size/2
            );

          const distance=
            Math.sqrt(
              dx*dx+
              dy*dy
            );

          const minimum=
            (
              size/2+
              p.size/2
            )*.78;

          if(
            distance<
            minimum
          ){

            good=false;

            break;

          }

        }

        if(good){

          found=true;

          break;

        }

      }

      if(!found){

        x=
          random(
            0,
            Math.max(
              1,
              width-size
            )
          );

        y=
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size
            )
          );

      }

      const p={

        x:x,
        y:y,

        homeX:x,
        homeY:y,

        vx:0,
        vy:0,

        size:size,

        phaseX:
          Math.random()*
          Math.PI*2,

        phaseY:
          Math.random()*
          Math.PI*2,

        speedX:
          random(
            .00032,
            .00072
          ),

        speedY:
          random(
            .00028,
            .00068
          ),

        amplitudeX:
          random(2.0,5.0),

        amplitudeY:
          random(2.0,5.0),

        rotation:0,

        pulsePhase:
          Math.random()*
          Math.PI*2,

        pulseSpeed:
          random(
            .00065,
            .00125
          ),

        rotSpeed:
          random(
            .00012,
            .00032
          )

      };

      placed.push(p);

      positions.set(
        stock.id,
        p
      );

    }
  );

}


/* =====================================================
   CLAMP
===================================================== */

function clampPosition(p){

  const w=
    innerWidth;

  const h=
    innerHeight;

  const maxX=
    Math.max(
      0,
      w-p.size
    );

  const maxY=
    Math.max(
      SAFE_TOP,
      h-p.size
    );

  p.x=
    Math.max(
      0,
      Math.min(
        maxX,
        p.x
      )
    );

  p.y=
    Math.max(
      SAFE_TOP,
      Math.min(
        maxY,
        p.y
      )
    );

}


function bounceFromEdges(p){

  const w=
    innerWidth;

  const h=
    innerHeight;

  const maxX=
    Math.max(
      0,
      w-p.size
    );

  const maxY=
    Math.max(
      SAFE_TOP,
      h-p.size
    );

  const bounce=.82;

  if(
    p.x<=0
  ){

    p.x=0;

    if(p.vx<0)
      p.vx=
        -p.vx*bounce;

  }else if(
    p.x>=maxX
  ){

    p.x=maxX;

    if(p.vx>0)
      p.vx=
        -p.vx*bounce;

  }

  if(
    p.y<=SAFE_TOP
  ){

    p.y=SAFE_TOP;

    if(p.vy<0)
      p.vy=
        -p.vy*bounce;

  }else if(
    p.y>=maxY
  ){

    p.y=maxY;

    if(p.vy>0)
      p.vy=
        -p.vy*bounce;

  }

}

   APPLY
===================================================== */

function applyPosition(id){

  const p=
    positions.get(id);

  const node=
    nodes.get(id);

  if(
    !p ||
    !node
  )
    return;

  node.card.style.setProperty(
    '--x',
    p.x+'px'
  );

  node.card.style.setProperty(
    '--y',
    p.y+'px'
  );

  node.card.style.setProperty(
    '--size',
    p.size+'px'
  );

  node.card.style.setProperty(
    '--rot',
    p.rotation+'deg'
  );

  const pulse=
    1+
    Math.sin(
      performance.now()*
      p.pulseSpeed+
      p.pulsePhase
    )*.035;

  node.card.style.setProperty(
    '--pulse',
    pulse.toFixed(4)
  );

}

}

function tradingViewLogo(symbol){
  const s=String(symbol||'').trim().toLowerCase();

}

function logoCandidates(symbol){
  const st=stockBySymbol.get(String(symbol||'').toUpperCase());
  const candidates=[];
  if(st&&st.logoid){
    candidates.push(
      'https://s3-symbol-logo.tradingview.com/'+
      encodeURIComponent(st.logoid)+'.svg'
    );
  }
  candidates.push(tradingViewLogo(symbol));
  return [...new Set(candidates)];
}

function setReliableLogo(img,symbol){
  if(!img)return;
  const candidates=logoCandidates(symbol);
  let i=0;
  img.onerror=()=>{
    i++;
    if(i<candidates.length) img.src=candidates[i];
    else { img.onerror=null; img.src=fallbackLogo(symbol); }
  };
  img.src=candidates[0]||fallbackLogo(symbol);
}

/* ---------- TRADINGVIEW (Scanner publik, semua saham IDX) ---------- */
const TV_SCAN_URL='https://scanner.tradingview.com/indonesia/scan';
const TV_COLS=['name','description','close','change','volume','market_cap_basic','high','low','logoid'];
function tvRowToQuote(r){
  const d=r.d||[]; const sym=String(d[0]||String(r.s||'').split(':')[1]||'').toUpperCase();
  return {symbol:sym,name:d[1]||sym,price:d[2],pct:d[3],vol:d[4],cap:d[5],high:d[6],low:d[7],logoid:d[8]||''};
}
async function tvScan(body){
  const r=await fetch(TV_SCAN_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(Object.assign({columns:TV_COLS},body))});
  if(!r.ok)throw new Error('TradingView HTTP '+r.status);
  const j=await r.json(); return (j.data||[]).map(tvRowToQuote).filter(q=>q.symbol);
}
/* semua saham IDX di TradingView, urut market cap terbesar */
function fetchAllQuotes(){
  return tvScan({filter:[{left:'type',operation:'in_range',right:['stock']}],markets:['indonesia'],sort:{sortBy:'market_cap_basic',sortOrder:'desc'},range:[0,3000]});
}
/* dipakai pencarian untuk kode yang belum ada di daftar */
async function fetchQuotes(syms){
  const list=await tvScan({symbols:{tickers:syms.map(s=>'IDX:'+s),query:{types:[]}}});
  const map=new Map(); list.forEach(q=>{if(q.price>0)map.set(q.symbol,q);});
  if(!map.size)throw new Error('Data kosong'); return map;
}
function applyQuote(stock,q){
  if(q.price!=null)stock.current_price=q.price; if(q.pct!=null)stock.price_change_percentage_24h=q.pct;
  if(q.vol!=null)stock.total_volume=q.vol; if(q.cap!=null)stock.market_cap=q.cap;
  if(q.high!=null)stock.high_24h=q.high; if(q.low!=null)stock.low_24h=q.low;
  if(q.logoid)stock.logoid=q.logoid;
  if(q.name&&(stock.name===stock.symbol||!stock.name))stock.name=String(q.name);
}

let tvRefreshBusy=false;
async function refreshTradingViewPrices(force){
  if(tvRefreshBusy)return;
  if(!force&&Date.now()-lastAttemptTs<CACHE_MS)return; /* cache masih segar, tidak ambil data */
  tvRefreshBusy=true;
  try{
    const quotes=await fetchAllQuotes();
    if(quotes.length<100)throw new Error('Data terlalu sedikit');
    const prev=new Map(allStocks.map(s=>[s.symbol,s])), seen=new Set(), next=[]; let changed=quotes.length!==allStocks.length;
    quotes.forEach(q=>{
      if(seen.has(q.symbol))return; seen.add(q.symbol);
      let s=prev.get(q.symbol); if(!s){s=skeletonStock({symbol:q.symbol,name:q.name});changed=true;}
      applyQuote(s,q); next.push(s);
    });
    lastAttemptTs=Date.now();
    if(changed||quotes.some((q,i)=>!allStocks[i]||allStocks[i].symbol!==q.symbol)){
      allStocks=next; TOTAL_STOCKS=allStocks.length; indexStocks();
      if(window.__fillRank)window.__fillRank(); createPageMenu(); renderCurrentPage();
    }else{
      allStocks.forEach(stock=>{updateStock(stock);if(selectedStock&&selectedStock.id===stock.id)updatePopup(stock);});
    }
    writeStockCache();
    setLiveStatus('live','TRADINGVIEW '+new Date().toLocaleTimeString('id-ID')+' · '+allStocks.length+' saham');
  }catch(e){
    console.warn('TradingView gagal',e);
    setLiveStatus('error','TV: '+String(e&&e.message||e).slice(0,60));
  }finally{tvRefreshBusy=false;}
}
function connectStockData(){clearInterval(window.__tvRefreshTimer);window.__tvRefreshTimer=setInterval(refreshTradingViewPrices,CACHE_MS);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshTradingViewPrices();});


function updateStock(stock){

  updateListRow(stock);

  const node=
    nodes.get(
      stock.id
    );

  if(!node)
    return;

  node.priceEl.textContent=
    price(
      stock.current_price
    );

  const gain=
    Number(
      stock.price_change_percentage_24h
    )||0;

  node.gainEl.textContent=
    percent(gain);

  node.gainEl.className=
    'stockGain '+
    (
      gain>=0
        ?'up'
        :'down'
    );

  if(node.body){
    node.body.classList.toggle('gainUp',gain>=0);
    node.body.classList.toggle('gainDown',gain<0);
  }

  const p=
    positions.get(
      stock.id
    );

  if(!p)
    return;

  const oldSize=
    p.size;

  const newSize=
    sizeFromGain(
      gain
    );

  if(
    Math.abs(
      oldSize-newSize
    )>=1
  ){

    const cx=
      p.x+
      oldSize/2;

    const cy=
      p.y+
      oldSize/2;

    p.size=
      newSize;

    p.x=
      cx-
      newSize/2;

    p.y=
      cy-
      newSize/2;

    p.homeX=
      p.x;

    p.homeY=
      p.y;

    clampPosition(p);

    applyPosition(
      stock.id
    );

  }

}


/* =====================================================
   DRAG
===================================================== */

function enableDrag(
  card,
  id
){

  let pointerId=null;

  let startPointerX=0;
  let startPointerY=0;

  let startX=0;
  let startY=0;

  let lastX=0;
  let lastY=0;

  let velocityX=0;
  let velocityY=0;

  let moved=false;

  card.addEventListener(
    'pointerdown',
    e=>{

      const p=
        positions.get(id);

      if(!p)
        return;

      pointerId=
        e.pointerId;

      card.setPointerCapture(
        pointerId
      );

      startPointerX=
        e.clientX;

      startPointerY=
        e.clientY;

      startX=p.x;
      startY=p.y;

      lastX=e.clientX;
      lastY=e.clientY;

      velocityX=0;
      velocityY=0;

      moved=false;

      drag={
        id:id
      };

      card.classList.add(
        'dragging'
      );

    },
    {
      passive:true
    }
  );

  card.addEventListener(
    'pointermove',
    e=>{

      if(
        pointerId!==
        e.pointerId
      )
        return;

      if(
        !drag ||
        drag.id!==id
      )
        return;

      const p=
        positions.get(id);

      if(!p)
        return;

      const dx=
        e.clientX-
        startPointerX;

      const dy=
        e.clientY-
        startPointerY;

      if(
        Math.abs(dx)>3 ||
        Math.abs(dy)>3
      ){

        moved=true;

      }

      p.x=
        startX+
        dx;

      p.y=
        startY+
        dy;

      clampPosition(p);

      velocityX=
        velocityX*.55+
        (
          e.clientX-
          lastX
        )*.45;

      velocityY=
        velocityY*.55+
        (
          e.clientY-
          lastY
        )*.45;

      lastX=e.clientX;
      lastY=e.clientY;

      p.rotation=
        Math.max(
          -7,
          Math.min(
            7,
            velocityX*.7
          )
        );

      pushNeighbors(
        id,
        velocityX,
        velocityY
      );

      applyPosition(id);

    },
    {
      passive:true
    }
  );

  function release(e){

    if(
      pointerId!==
      e.pointerId
    )
      return;

    pointerId=null;

    const p=
      positions.get(id);

    if(p){

      p.vx+=
        velocityX*.45;

      p.vy+=
        velocityY*.45;

      p.homeX=
        p.x;

      p.homeY=
        p.y;

      p.rotation=0;

    }

    card.classList.remove(
      'dragging'
    );

    const wasClick=
      !moved;

    drag=null;

    if(wasClick){

      openPopup(id);

    }

  }

  card.addEventListener(
    'pointerup',
    release
  );

  card.addEventListener(
    'pointercancel',
    release
  );

}


/* =====================================================
   PUSH NEIGHBORS
===================================================== */

function pushNeighbors(
  movingId,
  vx,
  vy
){

  const moving=
    positions.get(
      movingId
    );

  if(!moving)
    return;

  positions.forEach(
    (other,id)=>{

      if(
        id===
        movingId
      )
        return;

      const dx=
        (
          other.x+
          other.size/2
        )-
        (
          moving.x+
          moving.size/2
        );

      const dy=
        (
          other.y+
          other.size/2
        )-
        (
          moving.y+
          moving.size/2
        );

      const distance=
        Math.sqrt(
          dx*dx+
          dy*dy
        );

      const minimum=
        (
          moving.size/2+
          other.size/2
        )*.92;

      if(
        distance<
        minimum
      ){

        const d=
          Math.max(
            distance,
            .001
          );

        const nx=
          dx/d;

        const ny=
          dy/d;

        const overlap=
          minimum-distance;

        const speed=
          Math.min(
            13,
            Math.sqrt(
              vx*vx+
              vy*vy
            )
          );

        const impulse=
          overlap*.95+
          speed*.42;

        other.vx+=
          nx*
          impulse;

        other.vy+=
          ny*
          impulse;

        other.rotation+=
          nx*
          impulse*
          .7;

        other.vx=
          Math.max(
            -8,
            Math.min(
              8,
              other.vx
            )
          );

        other.vy=
          Math.max(
            -8,
            Math.min(
              8,
              other.vy
            )
          );

        other.homeX+=
          nx*
          Math.min(
            11,
            overlap+
            speed*.65
          );

        other.homeY+=
          ny*
          Math.min(
            11,
            overlap+
            speed*.65
          );

        clampPosition(
          other
        );

      }

    }
  );

}


/* =====================================================
   FLOATING PHYSICS
===================================================== */

function animate(){

  const now=
    performance.now();

  positions.forEach(
    (p,id)=>{

      const held=
        drag &&
        drag.id===
        id;

      if(!held){

        const fx=
          Math.sin(
            now*
            p.speedX+
            p.phaseX
          )*
          p.amplitudeX;

        const fy=
          Math.cos(
            now*
            p.speedY+
            p.phaseY
          )*
          p.amplitudeY;

        const targetX=
          p.homeX+
          fx;

        const targetY=
          p.homeY+
          fy;

        p.vx+=
          (
            targetX-
            p.x
          )*.012;

        p.vy+=
          (
            targetY-
            p.y
          )*.012;

        p.vx*=.93;
        p.vy*=.93;

        p.x+=p.vx;
        p.y+=p.vy;

        p.rotation=
          Math.sin(
            now*
            p.rotSpeed+
            p.phaseX
          )*2.2;

      }

      bounceFromEdges(p);

      clampPosition(p);

      applyPosition(id);

    }
  );

  collisionPhysics();

  requestAnimationFrame(
    animate
  );

}


/* =====================================================
   COLLISION
===================================================== */

function collisionPhysics(){

  const ids=
    Array.from(
      positions.keys()
    );

  for(
    let i=0;
    i<ids.length;
    i++
  ){

    const a=
      positions.get(
        ids[i]
      );

    if(!a)
      continue;

    for(
      let j=i+1;
      j<ids.length;
      j++
    ){

      const b=
        positions.get(
          ids[j]
        );

      if(!b)
        continue;

      const dx=
        (
          b.x+
          b.size/2
        )-
        (
          a.x+
          a.size/2
        );

      const dy=
        (
          b.y+
          b.size/2
        )-
        (
          a.y+
          a.size/2
        );

      const distance=
        Math.sqrt(
          dx*dx+
          dy*dy
        );

      const minimum=
        (
          a.size/2+
          b.size/2
        )*.82;

      if(
        distance<
        minimum &&
        distance>.001
      ){

        const nx=
          dx/
          distance;

        const ny=
          dy/
          distance;

        const overlap=
          minimum-
          distance;

        const push=
          overlap*.045;

        a.x-=
          nx*
          push;

        a.y-=
          ny*
          push;

        b.x+=
          nx*
          push;

        b.y+=
          ny*
          push;

        const bounce=
          .008;

        a.vx-=
          nx*
          bounce;

        a.vy-=
          ny*
          bounce;

        b.vx+=
          nx*
          bounce;

        b.vy+=
          ny*
          bounce;

        clampPosition(a);
        clampPosition(b);

      }

    }

  }

}

/* =====================================================
   IDX NEWS (100 berita terbaru, RSS Google News: IDX/BEI/saham)
===================================================== */
const NEWS_LIMIT=100, NEWS_CACHE_MS=5*60*1000;
const NEWS_RSS='https://news.google.com/rss/search?q='+encodeURIComponent('IDX OR BEI OR "Bursa Efek Indonesia" saham when:7d')+'&hl=id&gl=ID&ceid=ID:id';
const NEWS_PROXIES=[
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://corsproxy.io/?'+encodeURIComponent(u),
  u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)
];
let newsCache=null, newsTs=0, newsBusy=false;

function timeAgo(d){
  const s=Math.max(0,(Date.now()-d.getTime())/1000);
  if(s<3600)return Math.max(1,Math.floor(s/60))+' menit lalu';
  if(s<86400)return Math.floor(s/3600)+' jam lalu';
  return Math.floor(s/86400)+' hari lalu';
}
async function fetchNews(){
  let lastErr;
  for(const mk of NEWS_PROXIES){
    try{
      const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),10000);
      const r=await fetch(mk(NEWS_RSS),{signal:ctl.signal}); clearTimeout(t);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const xml=new DOMParser().parseFromString(await r.text(),'text/xml');
      const items=[...xml.querySelectorAll('item')].map(it=>{
        const src=(it.querySelector('source')||{}).textContent||'';
        let title=(it.querySelector('title')||{}).textContent||'';
        if(src&&title.endsWith(' - '+src))title=title.slice(0,-(src.length+3));
        return {title:title,link:(it.querySelector('link')||{}).textContent||'',source:src,date:new Date((it.querySelector('pubDate')||{}).textContent||Date.now())};
      }).filter(n=>n.title&&n.link);
      if(!items.length)throw new Error('Kosong');
      items.sort((a,b)=>b.date-a.date);
      return items.slice(0,NEWS_LIMIT);
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error('Gagal memuat');
}
function renderNews(list){
  const box=document.getElementById('newsList'); box.innerHTML='';
  const frag=document.createDocumentFragment();
  list.forEach(n=>{
    const a=document.createElement('a'); a.className='newsItem'; a.href=n.link; a.target='_blank'; a.rel='noopener';
    const t=document.createElement('div'); t.className='newsTitle'; t.textContent=n.title;
    const m=document.createElement('div'); m.className='newsMeta'; m.textContent=(n.source?n.source+' · ':'')+timeAgo(n.date);
    a.appendChild(t); a.appendChild(m); frag.appendChild(a);
  });
  box.appendChild(frag);
  document.getElementById('newsCount').textContent=list.length+' berita';
}
async function openNews(){
  let ov=document.getElementById('newsOverlay');
  if(!ov){
    ov=document.createElement('div'); ov.id='newsOverlay'; ov.className='newsOverlay';
    ov.innerHTML='<div class="newsPanel"><div class="newsHead"><div><div class="newsHeadTitle">IDX News</div><div id="newsCount" class="newsHeadSub"></div></div><button id="newsClose" class="newsClose" aria-label="Tutup">×</button></div><div id="newsList" class="newsListBox"></div></div>';
    document.querySelector('.app').appendChild(ov);
    document.getElementById('newsClose').onclick=()=>ov.classList.remove('show');
    ov.addEventListener('pointerdown',e=>{if(e.target===ov)ov.classList.remove('show');});
  }
  ov.classList.add('show');
  const box=document.getElementById('newsList');
  if(newsCache&&Date.now()-newsTs<NEWS_CACHE_MS){renderNews(newsCache);return;}
  if(newsBusy)return;
  newsBusy=true;
  box.innerHTML='<div class="newsState">Memuat berita…</div>';
  document.getElementById('newsCount').textContent='';
  try{
    newsCache=await fetchNews(); newsTs=Date.now(); renderNews(newsCache);
  }catch(e){
    box.innerHTML='<div class="newsState">Gagal memuat berita.<br><button class="newsRetry" id="newsRetry">Coba lagi</button></div>';
    document.getElementById('newsRetry').onclick=()=>{newsBusy=false;openNews();};
  }finally{newsBusy=false;}
}

    url='https://www.idx.co.id/en/listed-companies/company-profiles/';
  }else if(type==='website'){
    url='https://www.google.com/search?q='+encodeURIComponent(symbol+' '+(selectedStock.name||'')+' official company website');
  }
  if(url)window.open(url,'_blank');
}

document.getElementById('tradingViewIcon').addEventListener('click',openTradingView);
document.getElementById('blockExplorer').addEventListener('click',()=>openStockLink('explorer'));
document.getElementById('coinWebsite').addEventListener('click',()=>openStockLink('website'));


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  'resize',
  ()=>{

    if(visibleStocks.length){

      createPositions();

      positions.forEach(
        (p,id)=>
          applyPosition(id)
      );

    }else{

      positions.forEach(
        p=>
          clampPosition(p)
      );

    }

  }
);


/* =====================================================
   TRADINGVIEW MARKET DATA AUTO REFRESH
===================================================== */
const liveStatus=document.getElementById('liveStatus');
const liveStatusText=document.getElementById('liveStatusText');
function setLiveStatus(state,text){if(!liveStatus||!liveStatusText)return;liveStatus.classList.remove('live','error');if(state==='live')liveStatus.classList.add('live');if(state==='error')liveStatus.classList.add('error');liveStatusText.textContent=text;}


/* =====================================================
   START
===================================================== */

createPageMenu();

loadAllStocks().then(ok=>{
  if(ok){
    connectStockData();
    refreshTradingViewPrices();
  }
});

requestAnimationFrame(
  animate
);

</script>
